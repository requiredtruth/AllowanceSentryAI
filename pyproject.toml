[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allowancesentryai"
version = "0.1.0"
description = "Offline deterministic EVM allowance exposure analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "requiredtruth"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.scripts]
allowancesentry = "allowancesentry.cli:main"

[tool.setuptools.packages.find]
include = ["allowancesentry*"]
